## Invariant — SMT-based guardrail SAST — GitLab CI
##
## Assumes:
##   - the `invariant-sast` package is installable via $INVARIANT_PIP_SPEC
##     below -- it defaults to the public PyPI package; override it to point
##     at your own source instead: a private index (set PIP_INDEX_URL),
##     your GitLab group's PyPI package registry, or a `git+https://` URL.
##   - reference/  holds the last-known-good (or LZAUC-upstream) copies of
##     every service-control-policies/*.json, rcp-policies/*.json, and
##     iam-policies/*.json file, mirroring that same subdirectory under
##     reference/ (e.g. reference/iam-policies/foo.json) -- used only by the
##     regression job below, and only for files you actually want an
##     INV_AWS_002 grant-regression proof on (permission boundaries and
##     other security-sensitive customer-managed IAM policies; a plain
##     least-privilege app policy doesn't need one, INV_AWS_003 covers it
##     with no reference at all)
##   - candidate files are whatever's on the MR branch under those same paths
##
## Two independent checks:
##   invariant:guardrail-regression  -- diff-scoped: only files that changed
##       in this MR, checked against your own reference/ pairing (INV_AWS_001
##       for SCP/RCP, INV_AWS_002 for IAM policies that have a reference/
##       copy). Keeps runtime bounded on large orgs with many guardrail
##       files.
##   invariant:guardrail-baseline    -- full sweep, every run: every SCP/RCP
##       under the repo checked against the LZA default guardrail catalog
##       bundled with the invariant package itself (INV_AWS_001), plus
##       INV_AWS_003 (privilege-escalation primitives) on every
##       iam-policies/*.json found, reference or not. No reference/ needed --
##       this is what `invariant scan` proves out of the box.

##
## Reporting and gating are split, because GitLab ingests a report's findings
## only when the job that produced it succeeds (allow_failure doesn't change
## that). Both check jobs run with --soft-fail so they exit 0 and their SARIF
## is ingested; invariant:gate then reads both results.json files and fails
## the pipeline on any failed check, or if a results file is missing.
## SARIF ingestion (artifacts:reports:sarif) needs GitLab Ultimate, generally
## available from GitLab 19.2. On other tiers the gate still blocks the merge
## and the reports are still downloadable as job artifacts.

stages:
  - policy-reasoning
  - gate

variables:
  # NotResource/NotAction-heavy IAM policies (permission boundaries) solve
  # noticeably slower than a typical SCP -- see README's "Performance"
  # section. Raise this if guardrail-regression/-baseline start timing out
  # once iam-policies/ has real content.
  SOLVER_TIMEOUT_SECONDS: "60"     # hard limit on each whole invariant command, not per file
  REFERENCE_DIR: "reference"
  CANDIDATE_DIRS: "service-control-policies rcp-policies iam-policies declarative-policies"
  INVARIANT_PIP_SPEC: "invariant-sast"   # override: private index, package registry, or git+https URL
  # `invariant`'s CLI table/summary auto-detects a tty and stays plain
  # otherwise, since a job's stdout is captured, not a tty -- force severity
  # coloring on anyway so the GitLab job log (which does render ANSI) shows
  # red/orange/green instead of plain text.
  FORCE_COLOR: "1"

# --- SMT permissiveness-regression check, diff-scoped -----------------------
invariant:guardrail-regression:
  stage: policy-reasoning
  image: python:3.12-slim
  needs: []
  before_script:
    - >-
      python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
    - printf 'pip==26.2.2\ncertifi>=2026.10.19\n' > "$CI_PROJECT_DIR/security-constraints.txt"
    - export PIP_CONSTRAINT="$CI_PROJECT_DIR/security-constraints.txt"
    - python -m pip install 'certifi>=2026.10.19'
    - python -m pip install --quiet "$INVARIANT_PIP_SPEC"
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - |
      # manifest.json is regenerated each run from whatever changed vs the
      # target branch, so you don't hand-maintain pairings for files that
      # didn't change in this MR.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=1
        DIFF_BASE="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        DIFF_BASE="$CI_COMMIT_BEFORE_SHA"
      fi
      python -m invariant.build_manifest \
        --diff-base "$DIFF_BASE" \
        --reference-dir "$REFERENCE_DIR" \
        --candidate-dirs $CANDIDATE_DIRS \
        --out manifest.json

    # A block scalar keeps the line continuations; a plain multi-line scalar
    # would fold them into escaped spaces and break the arguments.
    # --soft-fail: exit 0 on findings so GitLab ingests them; invariant:gate fails the pipeline.
    - |
      timeout "$SOLVER_TIMEOUT_SECONDS" invariant regression \
        --manifest manifest.json \
        --output cli --output sarif --output json \
        --out-dir solver-results \
        --soft-fail
  artifacts:
    when: always
    paths:
      - solver-results/
    reports:
      sarif: solver-results/results.sarif   # Ultimate; ingested only because this job succeeds
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 15m   # hard ceiling on the whole job, independent of SOLVER_TIMEOUT_SECONDS

# --- SMT baseline check against the bundled LZA default catalog -------------
invariant:guardrail-baseline:
  stage: policy-reasoning
  image: python:3.12-slim
  needs: []
  before_script:
    - >-
      python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
    - printf 'pip==26.2.2\ncertifi>=2026.10.19\n' > "$CI_PROJECT_DIR/security-constraints.txt"
    - export PIP_CONSTRAINT="$CI_PROJECT_DIR/security-constraints.txt"
    - python -m pip install 'certifi>=2026.10.19'
    - python -m pip install --quiet "$INVARIANT_PIP_SPEC"
  script:
    - |
      timeout "$SOLVER_TIMEOUT_SECONDS" invariant scan \
        --directory . \
        --output cli --output sarif --output json \
        --out-dir solver-results-baseline \
        --soft-fail
  artifacts:
    when: always
    paths:
      - solver-results-baseline/
    reports:
      sarif: solver-results-baseline/results.sarif
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 15m

# --- Gate: fail the pipeline on any failed check ----------------------------
# Runs only if both check jobs succeeded; if either failed (install error,
# solver timeout), the pipeline has already failed.
invariant:gate:
  stage: gate
  image: python:3.12-slim
  needs:
    - job: invariant:guardrail-regression
      artifacts: true
    - job: invariant:guardrail-baseline
      artifacts: true
  script:
    - |
      python - <<'EOF'
      import json
      import sys
      from pathlib import Path

      failed = 0
      for path in ("solver-results/results.json", "solver-results-baseline/results.json"):
          if not Path(path).is_file():
              print(f"FAIL {path} is missing, so this run proves nothing")
              failed += 1
              continue
          for result in json.loads(Path(path).read_text()):
              if isinstance(result, dict) and not result["passed"]:
                  print(f"FAIL {result['check_id']} ({result['severity']}) {result['file_path']}")
                  failed += 1
      print(f"{failed} failed check(s)" if failed else "All Invariant checks passed")
      sys.exit(1 if failed else 0)
      EOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

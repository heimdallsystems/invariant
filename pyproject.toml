[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-sast"
version = "0.3.5"
description = "SMT-based guardrail SAST for AWS SCP/RCP/IAM JSON (baseline + regression + privilege-escalation checks)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "z3-solver",
    "certifi>=2026.10.19",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = ["pytest"]

[project.urls]
Homepage = "https://heimdallsystems.github.io/invariant/"
Issues = "https://github.com/heimdallsystems/invariant/issues"
Repository = "https://github.com/heimdallsystems/invariant"

[project.scripts]
invariant = "invariant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invariant = ["baseline/**/*.json"]

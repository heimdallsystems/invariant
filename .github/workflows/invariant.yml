# Invariant guardrail checks -- GitHub Actions template
#
# This is a TEMPLATE: copy this file into your own AWS LZA config repo's
# .github/workflows/, not into a fork of the invariant tool repo itself.
# (See .gitlab-ci.yml for the equivalent GitLab job, if you deploy via
# GitLab instead.)
#
# Assumes:
#   - the `invariant-sast` package is installable via $INVARIANT_PIP_SPEC
#     below -- it defaults to the public PyPI package; override it to point
#     at your own source instead: a private index (set PIP_INDEX_URL), your
#     org's PyPI package registry, or a `git+https://` URL.
#   - reference/  holds the last-known-good (or LZAUC-upstream) copies of
#     every service-control-policies/*.json, rcp-policies/*.json, and
#     iam-policies/*.json file, mirroring that subdirectory under reference/
#     (e.g. reference/iam-policies/foo.json). Only used by the regression
#     job, and only needed for IAM policies you want an INV_AWS_002
#     grant-regression proof on -- INV_AWS_003 (privilege-escalation
#     primitives) runs with no reference at all, in the baseline job.
#   - candidate files are whatever's on the PR branch under those same paths.
#
# Two independent checks, same split as the GitLab template:
#   guardrail-baseline    -- full sweep, every run: every SCP/RCP under the
#       repo checked against the LZA default guardrail catalog bundled with
#       the invariant package itself (INV_AWS_001), plus INV_AWS_003 on
#       every iam-policies/*.json found. No reference/ needed.
#   guardrail-regression  -- diff-scoped: only files that changed in this
#       PR, checked against your own reference/ pairing (INV_AWS_001/002).

name: Invariant guardrail checks

on:
  pull_request:
  push:
    branches: [main]

# Explicit, since some org/repo defaults restrict GITHUB_TOKEN to
# read-only: github/codeql-action/upload-sarif needs security-events:write
# to post results, plus actions:read to look up the current workflow run
# (without it that lookup 500s as "Resource not accessible by integration"
# and fails the whole job, not just a warning).
permissions:
  contents: read
  security-events: write
  actions: read

env:
  INVARIANT_PIP_SPEC: invariant-sast   # override: private index, package registry, or git+https URL
  # NotResource/NotAction-heavy IAM policies (permission boundaries) solve
  # noticeably slower than a typical SCP -- see README's "Performance"
  # section. Raise this if either job starts timing out once
  # iam-policies/ has real content.
  SOLVER_TIMEOUT_SECONDS: "60"    # per-file hard timeout
  # `invariant`'s CLI table/summary auto-detects a tty and stays plain
  # otherwise, since a runner step's stdout is a pipe, not a tty -- force
  # severity coloring on anyway so the Actions log viewer (which does
  # render ANSI) shows red/orange/green instead of plain text.
  FORCE_COLOR: "1"

jobs:
  guardrail-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'

      - name: Install invariant
        run: python -m pip install --quiet "$INVARIANT_PIP_SPEC"

      - name: Run baseline scan
        run: |
          timeout "$SOLVER_TIMEOUT_SECONDS" invariant scan \
            --directory . \
            --output cli --output sarif --output json \
            --out-dir solver-results-baseline

      - name: Upload SARIF to code scanning
        if: always()
        # Code scanning is a separate, opt-in repo feature (Advanced
        # Security, paid on a private repo) -- this template shouldn't
        # force that on, so a repo without it enabled still gets a green
        # build from the scan step itself instead of a hard failure here.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: solver-results-baseline/results.sarif

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-baseline-results
          path: solver-results-baseline/
          retention-days: 30

  guardrail-regression:
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the diff-base fetch below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'

      - name: Install invariant
        run: python -m pip install --quiet "$INVARIANT_PIP_SPEC"

      - name: Build manifest.json from the PR diff
        id: manifest
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            DIFF_BASE="origin/$GITHUB_BASE_REF"
          else
            DIFF_BASE="$EVENT_BEFORE"
          fi
          # A branch's first push has no previous commit: github.event.before
          # is all zeros. A force push can also name a commit this clone
          # doesn't have. Either way there's nothing to diff against, so skip
          # the regression check rather than failing build_manifest.
          if [ -z "$DIFF_BASE" ] || ! git rev-parse --verify --quiet "$DIFF_BASE^{commit}" > /dev/null; then
            echo "::notice::No base commit to compare with (${DIFF_BASE:-none}); skipping the regression check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m invariant.build_manifest \
            --diff-base "$DIFF_BASE" \
            --reference-dir reference \
            --candidate-dirs service-control-policies rcp-policies iam-policies declarative-policies \
            --out manifest.json

      - name: Run regression check
        if: steps.manifest.outputs.skip != 'true'
        run: |
          timeout "$SOLVER_TIMEOUT_SECONDS" invariant regression \
            --manifest manifest.json \
            --output cli --output sarif --output json \
            --out-dir solver-results

      - name: Upload SARIF to code scanning
        if: always() && steps.manifest.outputs.skip != 'true'
        # Code scanning is a separate, opt-in repo feature (Advanced
        # Security, paid on a private repo) -- this template shouldn't
        # force that on, so a repo without it enabled still gets a green
        # build from the scan step itself instead of a hard failure here.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: solver-results/results.sarif

      - name: Upload results artifact
        if: always() && steps.manifest.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: invariant-regression-results
          path: solver-results/
          retention-days: 30

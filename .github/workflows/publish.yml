# Publish `invariant-sast` to PyPI via Trusted Publishing (OIDC) -- no API
# token stored in secrets. Register this workflow as a trusted publisher at
# https://pypi.org/manage/project/invariant-sast/settings/publishing/ (or,
# before the project exists on PyPI,
# https://pypi.org/manage/account/publishing/):
#   PyPI project name:  invariant-sast   (import name/CLI command stay `invariant`)
#   Owner:               Ikurira
#   Repository name:     invariant
#   Workflow name:        publish.yml
#   Environment name:    pypi   (must match the `environment:` below)
#
# Triggered by publishing a GitHub Release (tag matching the version in
# pyproject.toml, e.g. tag v0.1.0 for version = "0.1.0") -- for a manual
# release -- or via workflow_dispatch, dispatched by tag-release.yml
# (`gh workflow run publish.yml --ref vX.Y.Z`) once it creates that
# release automatically on a pyproject.toml version bump.
#
# tag-release.yml dispatches this explicitly rather than relying on this
# workflow's own `release: published` trigger to fire, because a release
# created via the default GITHUB_TOKEN (as its `gh release create` does)
# deliberately does not cascade into triggering other workflows --
# workflow_dispatch/repository_dispatch are the documented exception to
# that restriction, so an explicit dispatch is what actually runs.
#
# Do NOT turn this into a reusable workflow (`workflow_call`) invoked via
# `uses:` from tag-release.yml instead -- PyPI's Trusted Publishing does
# not support reusable workflows (the OIDC token's workflow claim ends up
# pointing at the caller, not this file, and publishing fails). Learned
# the hard way: see the 0.3.1 release.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing, nothing else needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

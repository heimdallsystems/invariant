# Auto-tags and releases a version bump landed on main, then publishes it,
# so a `version = "x.y.z"` edit in pyproject.toml is the only manual step
# needed to ship a release -- no `git tag` + `gh release create` by hand.
#
# Idempotent by construction: it only creates vX.Y.Z when that tag doesn't
# already exist, so a push to main that touches pyproject.toml but doesn't
# actually change the version (e.g. a dependency bump) is a no-op here.
#
# publish.yml is dispatched explicitly (`gh workflow run`, workflow_dispatch)
# rather than left to fire off its own `release: published` trigger, and
# NOT called as a reusable workflow (`uses:`) either -- both were tried and
# both are broken for this:
#   - `release: published`: a release created via the default GITHUB_TOKEN
#     (gh release create below) deliberately does not cascade into
#     triggering other workflows, to guard against recursive runs.
#   - `uses:` (reusable workflow call): runs, but PyPI Trusted Publishing
#     does not support reusable workflows -- the OIDC token's workflow
#     claim points at the caller (this file), not publish.yml, so PyPI's
#     publish step fails to be trusted at that point. Learned the hard way
#     on the 0.3.1 release.
# workflow_dispatch is the documented exception to the no-cascade
# restriction (along with repository_dispatch), and an explicit dispatch
# is still a distinct, top-level run of publish.yml -- not a nested call --
# so Trusted Publishing sees exactly the workflow it was registered for.

name: Tag release on version bump

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: write
  actions: write   # required to dispatch publish.yml via `gh workflow run`

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$version" ]; then
            echo "Could not find a version = \"...\" line in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag + GitHub release
        if: steps.check.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Dispatch publish.yml for the new tag
        if: steps.check.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            --ref "v${{ steps.version.outputs.version }}"
